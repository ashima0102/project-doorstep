spring:
  application:
    name: doorstep
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doorstep}
    username: ${DB_USER:doorstep}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: doorstep-fraud-check
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

doorstep:
  signals:
    store: redis   # redis | memory
  kafka:
    enabled: true
    applications-topic: loan.applications.v1
    decisions-topic: loan.decisions.v1

fraud:
  thresholds:
    review: 30     # score >= review  -> REVIEW
    reject: 60     # score >= reject  -> REJECT
  rules:
    pan-reused:
      points: 60
      window: 30d
    phone-shared:
      points: 35
      window: 30d
      min-distinct-pans: 3
    device-shared:
      points: 35
      window: 24h
      min-distinct-pans: 3
    kyc-mismatch:
      points: 30
    thin-file:
      points: 15
      min-history-months: 6
      amount-above: 300000
    income-inflated:
      points: 20
      multiplier: 3
